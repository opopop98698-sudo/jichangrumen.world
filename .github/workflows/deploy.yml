name: Build & Deploy jichangrumen.world

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate & Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Site Validation (0 Dead Links & Compliance)
        run: npm run validate

      - name: Build VitePress Static Site
        run: npm run docs:build

      - name: Run SEO / GEO Audit (Score 100/100 Check)
        run: npm run seo:audit

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages / Cloudflare Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
